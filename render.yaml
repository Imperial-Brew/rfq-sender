services:
  - type: web
    name: rfq-sender
    runtime: python
    buildCommand: pip install -r requirements-api.txt && cd frontend && npm install && npm run build
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: STREAMLIT_SECRETS_TOML
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
